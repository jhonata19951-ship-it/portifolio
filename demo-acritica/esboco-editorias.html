<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo: editorias em linha | A Crítica</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=3">
<style>
@font-face{font-family:DM;src:url(assets/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:DM;src:url(assets/fonts/dm-sans-latin-800-normal.woff2) format('woff2');font-weight:800}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#fff;color:#0d2340;font:500 14px/1.4 DM,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
.aviso{background:#0b1f3a;color:#cfe0ff;font-size:11.5px;text-align:center;padding:5px 12px}
.topo{padding:10px 12px 10px;background:#f4f7fa;border-bottom:1px solid #e3e8ef}
.topo h1{margin:0 0 8px;font:800 16px DM}
.opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opcoes button{border:1.5px solid #d5dde7;background:#fff;color:#0d2340;border-radius:12px;padding:8px 4px 7px;font:800 13px DM;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.opcoes button i{width:26px;height:26px;border-radius:50%;border:1px solid #0000001f}
.opcoes button small{font:500 10.5px DM;color:#6b7c90}
.opcoes button.on{border-color:#00a7e2;box-shadow:0 0 0 2px #00a7e244}
.nota{margin:8px 0 0;font-size:12px;color:#6b7c90}
iframe{flex:1;width:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>
<div class="aviso" role="note">Protótipo de redesign: não é o site oficial. Esboço das editorias em linha</div>
<div class="topo">
  <h1>Editorias no computador: como está ou numa linha só?</h1>
  <div class="opcoes" id="opcoes">
    <button data-v="atual"><i style="background:linear-gradient(90deg,#d6232f 50%,#5b2bb5 50%)"></i>Atual<small>blocos grandes</small></button>
    <button data-v="linha" class="on"><i style="background:linear-gradient(90deg,#d6232f 25%,#5b2bb5 25% 50%,#e8731a 50% 75%,#c2185b 75%)"></i>Nova<small>4 editorias lado a lado</small></button>
  </div>
  <p class="nota">Abra no computador. Na opção Nova, o botão da lua troca o tema direto, sem abrir menu. Role a prévia até Política, Polícia, Esportes e Entretenimento.</p>
</div>
<iframe id="previa" title="Prévia das editorias" src="index.html?editorias=linha#sec-politica"></iframe>
<script>
{
  const f = document.getElementById('previa');
  document.getElementById('opcoes').onclick = (e) => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    document.querySelectorAll('#opcoes button').forEach((x) => x.classList.toggle('on', x === b));
    f.src = 'index.html?editorias=' + b.dataset.v + '&t=' + Date.now();
  };
}
</script>
</body>
</html>
