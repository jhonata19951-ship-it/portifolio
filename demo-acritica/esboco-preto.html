<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only dark">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo: tons do tema Preto | A Crítica</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=3">
<style>
@font-face{font-family:DM;src:url(assets/fonts/dm-sans-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:DM;src:url(assets/fonts/dm-sans-latin-800-normal.woff2) format('woff2');font-weight:800}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#111;color:#eef2f6;font:500 14px/1.4 DM,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
.aviso{background:#0b1f3a;color:#cfe0ff;font-size:11.5px;text-align:center;padding:5px 12px}
.topo{padding:10px 12px 10px;background:#0b0b0c;border-bottom:1px solid #2a2a2a}
.topo h1{margin:0 0 8px;font:800 16px DM}
.opcoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.opcoes button{border:1.5px solid #333;background:#1a1a1a;color:#eef2f6;border-radius:12px;padding:8px 4px 7px;font:800 13px DM;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.opcoes button i{width:26px;height:26px;border-radius:50%;border:1px solid #ffffff33}
.opcoes button small{font:500 10.5px DM;color:#a3abb6}
.opcoes button.on{border-color:#00a7e2;box-shadow:0 0 0 2px #00a7e244}
.nota{margin:8px 0 0;font-size:12px;color:#a3abb6}
iframe{flex:1;width:100%;border:0;display:block;background:#000}
</style>
</head>
<body>
<div class="aviso" role="note">Protótipo de redesign: não é o site oficial. Esboço dos tons do Preto</div>
<div class="topo">
  <h1>Escolha o tom do tema Preto</h1>
  <div class="opcoes" id="opcoes">
    <button data-v="atual"><i style="background:#000"></i>Atual<small>preto puro</small></button>
    <button data-v="grafite" class="on"><i style="background:#121212"></i>Grafite<small>estilo YouTube</small></button>
    <button data-v="chumbo"><i style="background:#1c1c1e"></i>Chumbo<small>mais claro</small></button>
    <button data-v="azulado"><i style="background:#141a22"></i>Azulado<small>azul da marca</small></button>
  </div>
  <p class="nota">Toque numa opção e role o site abaixo para ver como fica.</p>
</div>
<iframe id="previa" title="Prévia do site no tema Preto" src="index.html?preto=grafite"></iframe>
<script>
{
  const f = document.getElementById('previa');
  document.getElementById('opcoes').onclick = (e) => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    document.querySelectorAll('#opcoes button').forEach((x) => x.classList.toggle('on', x === b));
    f.src = 'index.html?preto=' + b.dataset.v + '&t=' + Date.now();
  };
}
</script>
</body>
</html>
